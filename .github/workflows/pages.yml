name: Deploy Moonshadow Bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Path runtime configuration
        env:
          PATH_API_BASE_URL: ${{ secrets.PATH_API_BASE_URL }}
        run: |
          test -n "$PATH_API_BASE_URL"
          python - <<'PY'
          import json
          import os

          base_url = os.environ["PATH_API_BASE_URL"].strip()
          with open("path-config.js", "w", encoding="utf-8") as handle:
              handle.write("window.__PATH_CONFIG__ = ")
              handle.write(json.dumps({"apiBaseUrl": base_url}))
              handle.write(";\n")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
