name: Path checks

on:
  pull_request:
    paths:
      - "quick-path/**"
      - ".github/workflows/path-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: quick-path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quick-path/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
