name = "moonshadow-path-core-gen1"
main = "src/core.ts"
compatibility_date = "2026-08-10"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://REPLACE-WITH-NEW-PATH-CLIENT.example"
SOURCE_VERSION = "gen1-local-review"

[[durable_objects.bindings]]
name = "PATH_STATE"
class_name = "PathState"

[[migrations]]
tag = "gen1"
new_sqlite_classes = ["PathState"]

[[queues.producers]]
binding = "PATH_QUEUE"
queue = "moonshadow-wake-path-gen1"

[[queues.consumers]]
queue = "moonshadow-wake-path-gen1"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "moonshadow-wake-path-gen1-dlq"

[[services]]
binding = "ALLIE"
service = "moonshadow-path-allie-gen1"

[[services]]
binding = "AMBER"
service = "moonshadow-path-amber-gen1"
